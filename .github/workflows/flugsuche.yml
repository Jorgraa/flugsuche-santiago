name: Flugsuche Santiago

on:
  schedule:
    - cron: "15 5,17 * * *"    # täglich ca. 6:15 und 18:15 Uhr deutscher Zeit
  workflow_dispatch: {}         # manuell starten über "Run workflow"

permissions:
  contents: write

concurrency:
  group: flugsuche
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zubringer-Cache laden
        uses: actions/cache@v4
        with:
          path: cache
          key: flight-cache-${{ github.run_id }}
          restore-keys: flight-cache-

      - name: Suche starten
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/REPORT.md
        run: python -m flightwatch

      - name: Ergebnisse speichern
        run: |
          git config user.name "flugsuche-bot"
          git config user.email "flugsuche-bot@users.noreply.github.com"
          git add REPORT.md state/state.json
          git diff --cached --quiet || git commit -m "Suchlauf $(date -u +'%Y-%m-%d %H:%M')"
          git push
